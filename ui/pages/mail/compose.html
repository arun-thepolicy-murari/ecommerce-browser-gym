{% extends "mail/_mail_layout.html" %}
{% block title %}Compose{% endblock %}
{% block content %}

<form action="/mail/send" method="post"
      class="bg-white rounded-lg border border-slate-200 shadow-sm max-w-2xl" data-test-id="form-compose">
  <div class="px-5 py-3 border-b border-slate-200 font-bold">New message</div>
  <div class="px-5 py-4 space-y-3">
    <label class="block">
      <span class="text-xs text-slate-500">To</span>
      <input name="to" type="email" required value="{{ to_prefill or '' }}"
             data-test-id="input-compose-to" aria-label="To"
             class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
    </label>
    <label class="block">
      <span class="text-xs text-slate-500">Subject</span>
      <input name="subject" required value="{{ subject_prefill or '' }}"
             data-test-id="input-compose-subject" aria-label="Subject"
             class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
    </label>
    <label class="block">
      <span class="text-xs text-slate-500">Message</span>
      <textarea name="body" rows="8"
                data-test-id="input-compose-body" aria-label="Message"
                class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
    </label>
  </div>
  <div class="px-5 py-3 border-t border-slate-200 flex gap-2 items-center">
    <button type="submit" data-test-id="btn-send"
            class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-md text-sm font-semibold">Send</button>
    <a href="/mail" data-test-id="btn-cancel-compose"
       class="px-5 py-2 text-sm text-slate-500 hover:text-slate-700">Cancel</a>
  </div>
</form>

{% endblock %}
